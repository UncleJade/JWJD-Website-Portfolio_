    <style>
      .gallery-section {
        margin-bottom: 3rem;
      }
      .gallery-title {
        color: var(--accent);
        font-size: 2rem;
        margin-bottom: 1.5rem;
        text-align: center;
        font-weight: 700;
      }
      .gallery-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: center;
        overflow: visible; /* allow hovered images to expand beyond grid */
      }
      .gallery-img {
        width: 240px;
        height: 240px;
        object-fit: cover;
        border-radius: 1.2rem;
        box-shadow: 0 2px 8px 0 rgba(26,35,126,0.10);
        background: var(--card-bg);
        transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
        position: relative;
        z-index: 1;
        cursor: zoom-in;
        transform-origin: center center;
      }
      .gallery-img:hover {
        transform: scale(1.8);
        box-shadow: 0 16px 48px 0 rgba(26,35,126,0.28);
        z-index: 10;
        filter: saturate(110%);
      }
      /* Lightbox styles */
      .lightbox-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 5000;
      }
      .lightbox-overlay.active {
        display: flex;
      }
      .lightbox-content {
        position: relative;
        max-width: 95vw;
        max-height: 95vh;
      }
      .lightbox-content img {
        max-width: 95vw;
        max-height: 95vh;
        border-radius: 0.8rem;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        display: block;
      }
      .lightbox-close {
        position: absolute;
        top: -48px;
        right: 0;
        background: none;
        border: none;
        color: #fff;
        font-size: 2rem;
        cursor: pointer;
      }
      @media (max-width: 600px) {
        .gallery-img {
          width: 100%;
          height: auto;
          cursor: default;
        }
        .gallery-img:hover {
          transform: none; /* avoid aggressive zoom on mobile */
          box-shadow: 0 8px 24px 0 rgba(26,35,126,0.18);
          z-index: 1;
          filter: none;
        }
        .lightbox-close {
          top: 0.5rem;
          right: 0.5rem;
        }
      }
    </style>
  </head>

    <script>
      (function(){
        const overlay = document.getElementById('lightbox-overlay');
        const imageEl = document.getElementById('lightbox-image');
        const closeBtn = document.getElementById('lightbox-close');
        if (!overlay || !imageEl || !closeBtn) return;
        document.querySelectorAll('.gallery-img').forEach(img => {
          img.addEventListener('click', () => {
            imageEl.src = img.src;
            imageEl.alt = img.alt || 'Full view';
            overlay.classList.add('active');
            overlay.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
          });
        });
        function closeLightbox(){
          overlay.classList.remove('active');
          overlay.setAttribute('aria-hidden', 'true');
          imageEl.src = '';
          document.body.style.overflow = '';
        }
        closeBtn.addEventListener('click', closeLightbox);
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeLightbox(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
      })();
    </script>
